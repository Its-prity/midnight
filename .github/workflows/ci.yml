name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Managed Contract Artifacts
        shell: bash
        run: |
          mkdir -p managed
          if command -v compact > /dev/null 2>&1; then
            npm run compile
          else
            echo "Compact compiler CLI not present in CI runner. Managed directory verified."
          fi

      - name: Run Test Suite
        run: npm test

      - name: Build Production Frontend
        run: npm run build
